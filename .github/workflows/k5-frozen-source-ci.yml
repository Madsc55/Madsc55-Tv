name: K5 - Frozen Source Integrity (offline)
on:
  push:
    branches: [main]
    paths:
      - 'madsc/k5_source_audit.py'
      - 'madsc/k5_behavioral_compare.py'
      - 'tests/test_k5_source_audit.py'
      - 'tests/test_k5_behavioral_compare.py'
      - 'docs/LEGACY_SOURCE_SCOPE.json'
      - 'docs/K5_KAYNAK_DOGRULAMA_*.json'
      - '.github/workflows/k5-frozen-source-ci.yml'
  pull_request:
    paths:
      - 'madsc/k5_source_audit.py'
      - 'madsc/k5_behavioral_compare.py'
      - 'tests/test_k5_source_audit.py'
      - 'tests/test_k5_behavioral_compare.py'
      - 'docs/LEGACY_SOURCE_SCOPE.json'
      - 'docs/K5_KAYNAK_DOGRULAMA_*.json'
      - '.github/workflows/k5-frozen-source-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k5-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen source inventory and SHA coverage
        run: |
          mkdir -p reports
          python -m madsc.k5_source_audit --output reports/k5-source-audit.json
      - name: Offline source audit regression tests
        run: python -m unittest discover -s tests -p 'test_k5_source_audit.py' -v
      - name: Offline behavioral evidence comparison regression tests
        run: python -m unittest discover -s tests -p 'test_k5_behavioral_compare.py' -v
      - name: Upload audit evidence even on failure
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: k5-frozen-source-integrity
          path: reports/k5-source-audit.json
          if-no-files-found: warn
          retention-days: 14
