name: MADSC K1 — Guvenlik
on:
  workflow_dispatch:
    inputs:
      allow_parity_evidence:
        description: 'Opt-in isolated parity manifest for the K1 guard (no acceptance)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: madsc-k1-isolated
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: K1 legacy shadow security guard (read-only)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          if [[ "${{ inputs.allow_parity_evidence }}" == "true" ]]; then sha256sum config/shadow_manifest.json > reports/parity-input-before.sha256; fi
          set +e
          python -m src.madsc_guard config/shadow_manifest.json | tee reports/k1-guard.txt
          consumer_status=${PIPESTATUS[0]}
          set -e
          if [[ "$consumer_status" -ne 0 ]]; then
            if [[ "${{ inputs.allow_parity_evidence }}" == "true" ]]; then
              python -m madsc.parity_snapshot_cli --exit-code "$consumer_status" --output guard=reports/k1-guard.txt --output-root .
            fi
            exit "$consumer_status"
          fi
      - name: Snapshot K1 guard output (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        run: python -m madsc.parity_snapshot_cli --exit-code 0 --output guard=reports/k1-guard.txt --output-root .
      - name: Manifest öncesi girdi değişmezliğini doğrula (açık opt-in)
        if: ${{ inputs.allow_parity_evidence == true }}
        shell: bash
        run: sha256sum --check --status reports/parity-input-before.sha256
      - name: K1 girdi ve çıktı kanıtını bağla (açık opt-in)
        if: ${{ inputs.allow_parity_evidence == true }}
        run: python -m madsc.parity_manifest_cli --input config/shadow_manifest.json --snapshot reports/madsc-parity-snapshot.json --input-digest-receipt reports/parity-input-before.sha256 --workflow-path .github/workflows/madsc-01-guvenlik.yml --output-root .
      - name: Manifest sonrası girdi değişmezliğini doğrula (açık opt-in)
        if: ${{ inputs.allow_parity_evidence == true }}
        shell: bash
        run: sha256sum --check --status reports/parity-input-before.sha256
      - name: Upload K1 guard parity manifest (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k1-guard-parity-evidence
          path: reports/madsc-parity-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Isolated report
        run: python -m madsc.core --category k1 --output reports/k1.json
      - name: Upload isolated evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k1-isolated-evidence
          path: reports/k1.json
          retention-days: 14
