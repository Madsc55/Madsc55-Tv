name: MADSC K2 — Kesif
on:
  workflow_dispatch:
    inputs:
      allow_verified_history:
        description: 'Opt-in independently supplied real history validation (no fixture fallback)'
        type: boolean
        required: true
        default: false
      allow_network_discovery:
        description: 'Opt-in public network discovery (no production writes)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-k2-isolated
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Isolated report
        run: python -m madsc.core --category k2 --output reports/k2.json
      - name: Legacy multisource discovery (explicit opt-in only)
        if: ${{ inputs.allow_network_discovery == true }}
        run: python -m madsc.legacy_multisource_discovery
      - name: Public candidate discovery (explicit opt-in only)
        if: ${{ inputs.allow_network_discovery == true }}
        run: python -m madsc.live_discovery_pilot
      - name: Validate independent real history pair (explicit opt-in only)
        if: ${{ inputs.allow_verified_history == true }}
        run: |
          test -f verified-history-source/gecmis.json
          test -f verified-history-source/ana_liste_test_gecmisi.json
          mkdir -p reports
          python -m madsc.history_real_source_publish --folder verified-history-source --output reports/k2-real-history-source
      - name: Verify GitHub history provenance (explicit opt-in only)
        if: ${{ inputs.allow_verified_history == true }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f verified-history-source/manifest.json
          python -m madsc.history_verified_workflow --manifest verified-history-source/manifest.json --output reports/verified-k2-history.json
      - name: Upload isolated evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k2-isolated-evidence
          path: |
            reports/k2.json
            reports/k2-legacy-multisource.json
            reports/k2-live-pilot.json
            reports/k2-real-history-source/gecmis.json
            reports/k2-real-history-source/ana_liste_test_gecmisi.json
            reports/verified-k2-history.json
          if-no-files-found: error
          retention-days: 14
