name: MADSC K4 — Yedek
on:
  workflow_dispatch:
    inputs:
      allow_parity_evidence:
        description: 'Opt-in isolated parity manifest for the restore drill (no acceptance)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: madsc-k4-isolated
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Confirm K4 is an isolated fixture-only workflow
        shell: bash
        env:
          K4_EXTERNAL_BACKUP_ENABLED: 'false'
          K4_PRODUCTION_RESTORE_ENABLED: 'false'
        run: |
          test "$K4_EXTERNAL_BACKUP_ENABLED" = false
          test "$K4_PRODUCTION_RESTORE_ENABLED" = false
          test ! -e reports/k4-source
          echo "K4 acceptance: fixture-only; no external delivery or production restore"

      - name: K4 temporary backup and restore drill
        id: parity_consumer
        shell: bash
        run: |
          mkdir -p reports/k4-source/nested
          printf 'k4 fixture backup and restore\\n' > reports/k4-source/nested/sample.txt
          if [[ "${{ inputs.allow_parity_evidence }}" == "true" ]]; then sha256sum reports/k4-source/nested/sample.txt > reports/parity-input-before.sha256; fi
          if [[ "${{ inputs.allow_parity_evidence }}" == "true" ]]; then
            python -m madsc.parity_consumer_cli --consumer k4 --timeout-seconds 120
          else
          set +e
          python -m madsc.restore_drill --source reports/k4-source --file nested/sample.txt --output reports/k4-restore-drill.json
          consumer_status=$?
          set -e
          exit "$consumer_status"
          fi
      - name: Başarısız tüketicinin ölçülen tanı dosyalarını sakla (açık opt-in)
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_consumer.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-failed-consumer-snapshot
          path: |
            reports/parity-process-stdout.log
            reports/parity-process-stderr.log
            reports/parity-process-outcome.json
            reports/madsc-parity-snapshot.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload K4 restore drill evidence
        if: ${{ inputs.allow_parity_evidence != true }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-restore-drill
          path: reports/k4-restore-drill.json
          if-no-files-found: error
          retention-days: 14
      - name: Snapshot K4 restore drill output (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        run: python -m madsc.parity_snapshot_cli --exit-code 0 --output restore=reports/k4-restore-drill.json --output-root .
      - name: Manifest öncesi girdi değişmezliğini doğrula (açık opt-in)
        id: parity_input_before
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && (steps.parity_consumer.outcome == 'success' || steps.parity_consumer.outcome == 'failure') }}
        shell: bash
        run: sha256sum --check --status reports/parity-input-before.sha256
      - name: K4 girdi ve çıktı kanıtını bağla (açık opt-in)
        id: parity_manifest
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_input_before.outcome == 'success' }}
        run: python -m madsc.parity_manifest_cli --input reports/k4-source/nested/sample.txt --snapshot reports/madsc-parity-snapshot.json --input-digest-receipt reports/parity-input-before.sha256 --workflow-path .github/workflows/madsc-04-yedek.yml --output-root .
      - name: Manifest sonrası girdi değişmezliğini doğrula (açık opt-in)
        id: parity_input_after
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_manifest.outcome == 'success' }}
        shell: bash
        run: sha256sum --check --status reports/parity-input-before.sha256
      - name: Upload K4 parity manifest (explicit opt-in only)
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_input_after.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-parity-evidence
          path: reports/madsc-parity-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Isolated report
        run: python -m madsc.core --category k4 --output reports/k4.json
      - name: Upload isolated evidence
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-isolated-evidence
          path: reports/k4.json
          retention-days: 14
