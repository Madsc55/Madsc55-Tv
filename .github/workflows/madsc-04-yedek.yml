name: MADSC K4 — Yedek
on:
  workflow_dispatch:
    inputs:
      allow_parity_evidence:
        description: 'Opt-in isolated parity manifest for the restore drill (no acceptance)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: madsc-k4-isolated
  cancel-in-progress: false
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: K4 temporary backup and restore drill
        shell: bash
        run: |
          mkdir -p reports/k4-source/nested
          printf 'k4 fixture backup and restore\\n' > reports/k4-source/nested/sample.txt
          python -m madsc.restore_drill --source reports/k4-source --file nested/sample.txt --output reports/k4-restore-drill.json
      - name: Upload K4 restore drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-restore-drill
          path: reports/k4-restore-drill.json
          if-no-files-found: error
          retention-days: 14
      - name: Snapshot K4 restore drill output (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        run: python -m madsc.parity_snapshot_cli --exit-code 0 --output restore=reports/k4-restore-drill.json --output-root .
      - name: Bind K4 parity input and snapshot (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        run: python -m madsc.parity_manifest_cli --input reports/k4-source/nested/sample.txt --snapshot reports/madsc-parity-snapshot.json --workflow-path .github/workflows/madsc-04-yedek.yml --output-root .
      - name: Upload K4 parity manifest (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-parity-evidence
          path: reports/madsc-parity-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Isolated report
        run: python -m madsc.core --category k4 --output reports/k4.json
      - name: Upload isolated evidence
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-isolated-evidence
          path: reports/k4.json
          retention-days: 14
