name: Madsc55-Tv - Besli Toplu Guvenlik ve Kabul
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'madsc/**'
      - 'tests/**'
      - '.github/workflows/madsc-05-bakim.yml'
permissions:
  contents: read
concurrency:
  group: madsc-five-system-batch
  cancel-in-progress: false
jobs:
  k1:
    name: Güvenlik
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tüm regresyon testlerini çalıştır
        run: python -m unittest discover -s tests -v
      - name: K1 salt okunur kanıt raporunu oluştur
        if: ${{ always() && !cancelled() }}
        run: python -m madsc.core --category k1 --output reports/k1.json
      - name: K1 kanıtını sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k1
          path: reports/k1.json
          retention-days: 14
  k2:
    if: ${{ always() && !cancelled() }}
    name: Keşif
    needs: k1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K2 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k2 --output reports/k2.json
      - name: K2 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k2
          path: reports/k2.json
          retention-days: 14
  k3:
    if: ${{ always() && !cancelled() }}
    name: Kanal Testleri
    needs: k2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K3 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k3 --output reports/k3.json
      - name: K3 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k3
          path: reports/k3.json
          retention-days: 14
  k4:
    if: ${{ always() && !cancelled() }}
    name: Arşiv ve Yedek
    needs: k3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K4 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k4 --output reports/k4.json
      - name: K4 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k4
          path: reports/k4.json
          retention-days: 14
  k5:
    if: ${{ always() && !cancelled() }}
    name: Genel Bakım
    needs: k4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K5 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k5 --output reports/k5.json
      - name: K5 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k5
          path: reports/k5.json
          retention-days: 14
  toplu-kabul:
    if: ${{ always() && !cancelled() }}
    name: Beşli toplu kanıt doğrulama
    needs: [k1, k2, k3, k4, k5]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Beş kategori kanıtını indir
        uses: actions/download-artifact@v4
        with:
          pattern: madsc-batch-k*
          path: reports/collected
          merge-multiple: false
      - name: Kanıtları doğrula ve tek rapor oluştur
        id: kabul
        continue-on-error: true
        run: python -m madsc.batch_acceptance --reports reports/collected --output reports/toplu-kabul.json
      - name: Toplu raporu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-five-system-acceptance
          path: reports/toplu-kabul.json
          retention-days: 14
      - name: Tüm kategori sonuçlarını değerlendir
        if: ${{ always() && !cancelled() }}
        env:
          K1: ${{ needs.k1.result }}
          K2: ${{ needs.k2.result }}
          K3: ${{ needs.k3.result }}
          K4: ${{ needs.k4.result }}
          K5: ${{ needs.k5.result }}
          KABUL: ${{ steps.kabul.outcome }}
        run: |
          mkdir -p reports
          echo '## Madsc55-Tv - Besli Test Sonuclari' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Kontrol | Sonuc |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          hata=0
          for ad in K1 K2 K3 K4 K5 KABUL; do
            case "$ad" in
              K1) durum="$K1"; etiket="K1 Guvenlik";;
              K2) durum="$K2"; etiket="K2 Kesif";;
              K3) durum="$K3"; etiket="K3 Kanal";;
              K4) durum="$K4"; etiket="K4 Yedek";;
              K5) durum="$K5"; etiket="K5 Bakim";;
              KABUL) durum="$KABUL"; etiket="Toplu kabul";;
            esac
            echo "| $etiket | $durum |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$durum" != success ]; then hata=1; fi
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "$hata" -eq 0 ]; then
            echo '**Genel sonuc: BASARILI (yalniz izole testler).**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Genel sonuc: BASARISIZ - uretim onayi yok.**' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'K1=%s\nK2=%s\nK3=%s\nK4=%s\nK5=%s\nKABUL=%s\nGENEL=%s\n' "$K1" "$K2" "$K3" "$K4" "$K5" "$KABUL" "$hata" > reports/test-sonuclari.txt
          exit "$hata"
      - name: Test sonucunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-test-sonuclari
          path: reports/test-sonuclari.txt
          retention-days: 14
