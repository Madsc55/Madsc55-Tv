name: Madsc55-Tv - Besli Toplu Guvenlik ve Kabul
on:
  workflow_dispatch:
    inputs:
      allow_legacy_source_audit:
        description: 'Opt-in read-only 99-workflow GitHub source audit'
        type: boolean
        required: true
        default: false
      allow_legacy_notes_merge:
        description: 'Opt-in archived notes merge in temporary checkout'
        type: boolean
        required: true
        default: false
      allow_parity_evidence:
        description: 'Opt-in isolated parity manifest for the K2 handoff slice (no acceptance)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: madsc-five-system-batch
  cancel-in-progress: false
jobs:
  k1:
    name: Güvenlik
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tüm regresyon testlerini çalıştır
        id: regression
        shell: bash
        run: |
          mkdir -p reports
          set +e
          python -m unittest discover -s tests -v > reports/regression.log 2>&1
          sonuc=$?
          cat reports/regression.log
          echo "exit_code=$sonuc" >> "$GITHUB_OUTPUT"
          exit "$sonuc"
      - name: K1-K5 gercek kurulum, eksik kanit ve yazma noktasi envanteri
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          mkdir -p reports
          python -m madsc.five_system_installation > reports/k1-k5-installation-audit.json
          python -m json.tool reports/k1-k5-installation-audit.json >/dev/null
      - name: Toplu kurulum envanterini sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k1-k5-installation-audit
          path: reports/k1-k5-installation-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Offline besli sistem ve 22 gorev kanit kapisi
        id: offline_gate
        shell: bash
        run: |
          mkdir -p reports
          python -m madsc.offline_gate > reports/offline-gate.json
          cat reports/offline-gate.json
      - name: Offline kapi raporunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-offline-five-stage-gate
          path: reports/offline-gate.json
          if-no-files-found: warn
          retention-days: 14
      - name: Regresyon hatalarını otomatik sınıflandır
        if: ${{ always() && !cancelled() }}
        run: python -m madsc.ci_diagnostics --log reports/regression.log --output reports/regression-diagnostics.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Regresyon loglarını ve teşhis raporunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-regression-diagnostics
          path: |
            reports/regression.log
            reports/regression-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      - name: K1 salt okunur kanıt raporunu oluştur
        if: ${{ always() && !cancelled() }}
        run: python -m madsc.core --category k1 --output reports/k1.json
      - name: K1 kanıtını sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k1
          path: reports/k1.json
          retention-days: 14
  k2:
    if: ${{ needs.k1.result == 'success' }}
    name: Keşif
    needs: k1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K2 icin salt okunur ornek M3U kaynagi olustur
        run: |
          mkdir -p reports
          printf '#EXTM3U\n#EXTINF:-1 tvg-id="fixture.tv",Fixture only\nhttps://example.org/fixture.m3u8\n' > reports/k2-input.m3u
      - name: K2 izole aday kanıtını üret
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        id: parity_consumer
        shell: bash
        run: |
          if [[ "${{ inputs.allow_parity_evidence }}" == "true" ]]; then sha256sum reports/k2-input.m3u > reports/parity-input-before.sha256; fi
          if [[ "${{ inputs.allow_parity_evidence }}" == "true" ]]; then
            python -m madsc.parity_consumer_cli --consumer k5 --timeout-seconds 120
          else
          set +e
          python -m madsc.artifact_transport produce --path reports/k2-candidates.json --source reports/k2-input.m3u --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA"
          consumer_status=$?
          set -e
          exit "$consumer_status"
          fi
      - name: Başarısız tüketicinin ölçülen tanı dosyalarını sakla (açık opt-in)
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_consumer.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k2-failed-consumer-snapshot
          path: |
            reports/parity-process-stdout.log
            reports/parity-process-stderr.log
            reports/parity-process-outcome.json
            reports/madsc-parity-snapshot.json
          if-no-files-found: ignore
          retention-days: 14
      - name: K2 fixture history input
        run: |
          mkdir -p reports/history-input
          printf '%s\n' '{"history":{"fixture":{"runs":2,"last_result":"FAIL"}}}' > reports/history-input/gecmis.json
          printf '%s\n' '{"channels":{"fixture":{"runs":2,"last_result":"FAIL"}}}' > reports/history-input/ana_liste_test_gecmisi.json
      - name: K2 history handoff produce
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.history_transport produce --legacy-folder reports/history-input --output reports/k2-history.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA"
      - name: Upload K2 history handoff
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k2-history-handoff
          path: reports/k2-history.json
          if-no-files-found: error
          retention-days: 14
      - name: K2 aday kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k2-candidate-handoff
          path: reports/k2-candidates.json
          if-no-files-found: error
          retention-days: 14
      - name: Snapshot K2 handoff output (explicit opt-in only)
        if: ${{ inputs.allow_parity_evidence == true }}
        run: python -m madsc.parity_snapshot_cli --exit-code 0 --output candidates=reports/k2-candidates.json --output-root .
      - name: Manifest öncesi girdi değişmezliğini doğrula (açık opt-in)
        id: parity_input_before
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && (steps.parity_consumer.outcome == 'success' || steps.parity_consumer.outcome == 'failure') }}
        shell: bash
        run: sha256sum --check --status reports/parity-input-before.sha256
      - name: K2 aktarım girdisi ve çıktı kanıtını bağla (açık opt-in)
        id: parity_manifest
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_input_before.outcome == 'success' }}
        run: python -m madsc.parity_manifest_cli --input reports/k2-input.m3u --snapshot reports/madsc-parity-snapshot.json --input-digest-receipt reports/parity-input-before.sha256 --workflow-path .github/workflows/madsc-05-bakim.yml --output-root .
      - name: Manifest sonrası girdi değişmezliğini doğrula (açık opt-in)
        id: parity_input_after
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_manifest.outcome == 'success' }}
        shell: bash
        run: sha256sum --check --status reports/parity-input-before.sha256
      - name: Upload K2 handoff parity manifest (explicit opt-in only)
        if: ${{ always() && !cancelled() && inputs.allow_parity_evidence == true && steps.parity_input_after.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k2-handoff-parity-evidence
          path: reports/madsc-parity-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: K2 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k2 --output reports/k2.json
      - name: K2 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k2
          path: reports/k2.json
          retention-days: 14
  k3:
    if: ${{ needs.k2.result == 'success' }}
    name: Kanal Testleri
    needs: k2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K2 aday kanıtını indir
        uses: actions/download-artifact@v4
        with:
          name: madsc-k2-candidate-handoff
          path: reports/k2-handoff
      - name: K2 kanıtını K3'te doğrula
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.artifact_transport consume --path reports/k2-handoff/k2-candidates.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA" --output reports/k3-handoff.json
      - name: Download K2 history evidence
        uses: actions/download-artifact@v4
        with:
          name: madsc-k2-history-handoff
          path: reports/history-source
      - name: Verify history evidence in k3
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.history_transport consume --path reports/history-source/k2-history.json --output reports/k3-history.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA"
      - name: Upload k3 history receipt
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k3-history-receipt
          path: reports/k3-history.json
          if-no-files-found: error
          retention-days: 14
      - name: K3 aktarim kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k3-handoff
          path: reports/k3-handoff.json
          if-no-files-found: error
          retention-days: 14
      - name: K3 aday parmak iziyle bagli offline fixture kaniti
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/reports
          python -c 'import json;from madsc.batch_acceptance import _unique_json_pairs;from madsc.artifact_handoff import unpack;import os;d=json.load(open("reports/k2-handoff/k2-candidates.json"),object_pairs_hook=_unique_json_pairs);c=unpack(d,os.environ["RUN_ID"],os.environ["COMMIT_SHA"])["candidates"];print(json.dumps([{"url_sha256":x["url_sha256"],"ffprobe":{"streams":[{"codec_type":"video"},{"codec_type":"audio"}],"format":{"duration":"40"}}} for x in c]))' > reports/k3-offline-input.json
          python -m madsc.candidate_probe_link --candidates reports/k2-handoff/k2-candidates.json --probes reports/k3-offline-input.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA" --isolated-report-root reports
      - name: K3 korumali kaniti sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k3-guarded-evidence
          path: reports/reports/k3-isolated-evidence.json
          retention-days: 14
      - name: K3 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k3 --output reports/k3.json
      - name: K3 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k3
          path: reports/k3.json
          retention-days: 14
  k4:
    if: ${{ needs.k3.result == 'success' }}
    name: Arşiv ve Yedek
    needs: k3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K4 gercek izole yedek ve geri yukleme tatbikati
        run: |
          mkdir -p reports/k4-drill-source/nested
          printf 'backup restore evidence\\n' > reports/k4-drill-source/nested/sample.txt
          python -m madsc.restore_drill --source reports/k4-drill-source --file nested/sample.txt --output reports/k4-restore-drill.json
      - name: K4 K1 korumali izole kanit raporu
        run: |
          mkdir -p reports/reports
          python -m madsc.restore_drill --source reports/k4-drill-source --file nested/sample.txt --output reports/reports/k4-isolated-evidence.json --isolated-report-root reports
      - name: K4 korumali kaniti sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-guarded-evidence
          path: reports/reports/k4-isolated-evidence.json
          retention-days: 14
      - name: K4 geri yukleme tatbikati kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-restore-drill
          path: reports/k4-restore-drill.json
          if-no-files-found: error
          retention-days: 14
      - name: K4 salt okunur kanıt raporunu oluştur
        run: python -m madsc.core --category k4 --output reports/k4.json
      - name: K4 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k4
          path: reports/k4.json
          retention-days: 14
  k5:
    if: ${{ needs.k4.result == 'success' }}
    name: Genel Bakım
    needs: k4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: K2 aday kanıtını indir
        uses: actions/download-artifact@v4
        with:
          name: madsc-k2-candidate-handoff
          path: reports/k2-handoff
      - name: K2 kanıtını K5'te aynı koşuyla doğrula
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.artifact_transport consume --path reports/k2-handoff/k2-candidates.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA" --output reports/k5-handoff.json
      - name: Download K2 history evidence
        uses: actions/download-artifact@v4
        with:
          name: madsc-k2-history-handoff
          path: reports/history-source
      - name: Verify history evidence in k5
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.history_transport consume --path reports/history-source/k2-history.json --output reports/k5-history.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA"
      - name: Upload k5 history receipt
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-history-receipt
          path: reports/k5-history.json
          if-no-files-found: error
          retention-days: 14
      - name: K5 aktarim kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-handoff
          path: reports/k5-handoff.json
          if-no-files-found: error
          retention-days: 14
      - name: K3 aday dogrulama makbuzunu K5 icin indir
        uses: actions/download-artifact@v4
        with:
          name: madsc-k3-handoff
          path: reports/k3-handoff-source
      - name: K2 K3 K5 ayni kosu aday kanitini K5'te dogrula
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.handoff_acceptance --k2 reports/k2-handoff/k2-candidates.json --k3 reports/k3-handoff-source/k3-handoff.json --k5 reports/k5-handoff.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA" --output reports/k5-cross-handoff-verification.json
      - name: K5 capraz aday kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-cross-handoff-verification
          path: reports/k5-cross-handoff-verification.json
          if-no-files-found: error
          retention-days: 14
      - name: K3 bagli offline teknik kanitini K5 icin indir
        uses: actions/download-artifact@v4
        with:
          name: madsc-k3-guarded-evidence
          path: reports/k3-technical-evidence
      - name: K5 K3 offline kanit guvenlik kapisi
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.k5_channel_gate --k2 reports/k2-handoff/k2-candidates.json --k3 reports/k3-technical-evidence/k3-isolated-evidence.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA" --output reports/k5-k3-safety-gate.json
      - name: K5 K3 guvenlik kapisi kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-k3-safety-gate
          path: reports/k5-k3-safety-gate.json
          if-no-files-found: error
          retention-days: 14
      - name: K1-K4 gercek kategori kanitlarini indir
        uses: actions/download-artifact@v4
        with:
          pattern: madsc-batch-k[1-4]
          path: reports/k5-actual-evidence
          merge-multiple: false
      - name: K5 mevcut kategori kanitini olustur
        run: python -m madsc.core --category k5 --output reports/k5.json
      - name: K5 kendi kategori kanitini ayni paket yapisina ekle
        run: |
          mkdir -p reports/k5-actual-evidence/madsc-batch-k5 reports/reports
          cp reports/k5.json reports/k5-actual-evidence/madsc-batch-k5/k5.json
      - name: K5 gercek bes kategori kanitini K1 korumali raporla
        run: python -m madsc.stage_report_cli --stage k5 --batch-evidence-root reports/k5-actual-evidence --isolated-report-root reports
      - name: K5 korumali kaniti sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-guarded-evidence
          path: reports/reports/k5-isolated-evidence.json
          retention-days: 14
      - name: K5 99 eski workflow kaynak bütünlüğü (explicit opt-in)
        if: ${{ inputs.allow_legacy_source_audit == true }}
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          python -m unittest discover -s tests -p test_legacy_99_source_integrity.py -v
          python -m madsc.legacy_99_bulk_audit --output reports/legacy-99-source-audit.json
      - name: K5 eski notları birleştir ve SHA256 doğrula (explicit opt-in)
        if: ${{ inputs.allow_legacy_notes_merge == true }}
        timeout-minutes: 15
        run: |
          python scripts/birlestir_eski_sistem_notlari.py --include-structured
          python -m madsc.legacy_notes_integrity --merged ESKI_SISTEM_NOTLARI.md --archive docs/eski_depo_not_arsivi --report reports/eski-notlar-dogrulama.json
      - name: K5 opt-in eski kaynak raporlarını sakla
        if: ${{ always() && !cancelled() && (inputs.allow_legacy_source_audit == true || inputs.allow_legacy_notes_merge == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-legacy-source-evidence
          path: |
            reports/legacy-99-source-audit.json
            reports/eski-notlar-dogrulama.json
            ESKI_SISTEM_NOTLARI.md
          if-no-files-found: error
          retention-days: 30
      - name: Yardımcı paket sözleşmesini koru — madsc-legacy-99-bulk-audit.yml
        if: ${{ success() && inputs.allow_legacy_source_audit == true }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-legacy-99-source-audit
          path: reports/legacy-99-source-audit.json
          if-no-files-found: error
      - name: Yardımcı paket sözleşmesini koru — madsc-legacy-notes-bulk-merge.yml
        if: ${{ success() && inputs.allow_legacy_notes_merge == true }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-eski-notlar-tek-dosya-ve-sha256
          path: |
            ESKI_SISTEM_NOTLARI.md
            reports/eski-notlar-dogrulama.json
          if-no-files-found: error
          retention-days: 30
      - name: K5 on yardimci workflow ve 22 gorev kaynak envanteri
        run: |
          mkdir -p reports
          python -m madsc.workflow_consolidation > reports/workflow-consolidation.json
          python -m madsc.workflow_consolidation --behavior-matrix > reports/workflow-contract-matrix.json
          python -m madsc.workflow_consolidation --contract-gate > reports/workflow-contract-gate.json
          python -m json.tool reports/workflow-contract-matrix.json >/dev/null
          python -m madsc.k1_k5_acceptance_requirements > reports/k1-k5-evidence-requirements.json
      - name: K5 92 sabit kaynak SHA kapsam kapisi
        shell: bash
        run: |
          mkdir -p reports
          python -m madsc.k5_source_audit --output reports/k5-source-audit.json
          python -m json.tool reports/k5-source-audit.json >/dev/null
      - name: K5 92 kaynak SHA raporunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-frozen-source-audit
          path: reports/k5-source-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: K5 envanter ve eksik kanit raporlarini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k5-consolidation-and-task-evidence
          path: |
            reports/workflow-consolidation.json
            reports/workflow-contract-matrix.json
            reports/workflow-contract-gate.json
            reports/k1-k5-evidence-requirements.json
          if-no-files-found: error
          retention-days: 14
      - name: K5 kanita dayali proje ilerleme tablosunu olustur
        run: python -m madsc.progress_scorecard --output reports/progress-scorecard.json
      - name: K5 ilerleme kanitini sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-progress-scorecard
          path: reports/progress-scorecard.json
          if-no-files-found: error
          retention-days: 14
      - name: K5 kanıtını sakla
        uses: actions/upload-artifact@v4
        with:
          name: madsc-batch-k5
          path: reports/k5.json
          retention-days: 14
  toplu-kabul:
    if: ${{ always() && !cancelled() }}
    name: Beşli toplu kanıt doğrulama
    needs: [k1, k2, k3, k4, k5]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python ortamını hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Beş kategori kanıtını indir
        uses: actions/download-artifact@v4
        with:
          pattern: madsc-batch-k*
          path: reports/collected
          merge-multiple: false
      - name: K2 aday kanıtını toplu kabulde indir
        uses: actions/download-artifact@v4
        with:
          name: madsc-k2-candidate-handoff
          path: reports/k2-handoff
      - name: Download history chain
        uses: actions/download-artifact@v4
        with:
          pattern: madsc-*-history-*
          path: reports/history-chain
      - name: Verify K2 K3 K5 history chain
        id: history-chain
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.history_transport verify --k2 reports/history-chain/madsc-k2-history-handoff/k2-history.json --k3 reports/history-chain/madsc-k3-history-receipt/k3-history.json --k5 reports/history-chain/madsc-k5-history-receipt/k5-history.json --output reports/history-chain-acceptance.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA"
      - name: K2 aday kanıtının koşu bütünlüğünü denetle
        id: k2-handoff
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.artifact_transport consume --path reports/k2-handoff/k2-candidates.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA"
      - name: K3 ve K5 aktarim kanitlarini indir
        uses: actions/download-artifact@v4
        with:
          pattern: madsc-k*-handoff
          path: reports/handoffs
      - name: K2 K3 K5 kanitlarini topluca dogrula
        id: cross-handoff
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: python -m madsc.handoff_acceptance --k2 reports/k2-handoff/k2-candidates.json --k3 reports/handoffs/madsc-k3-handoff/k3-handoff.json --k5 reports/handoffs/madsc-k5-handoff/k5-handoff.json --run-id "$RUN_ID" --commit-sha "$COMMIT_SHA" --output reports/k2-k3-k5-kabul.json
      - name: Capraz aktarim raporunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-cross-handoff-acceptance
          path: reports/k2-k3-k5-kabul.json
          retention-days: 14
      - name: K4 restore tatbikati kanitini indir
        uses: actions/download-artifact@v4
        with:
          name: madsc-k4-restore-drill
          path: reports/k4-drill
      - name: K4 restore kanitini toplu kabulde dogrula
        id: k4-restore
        continue-on-error: true
        run: python -m madsc.k4_evidence --report reports/k4-drill/k4-restore-drill.json --output reports/k4-restore-acceptance.json
      - name: K4 restore kabul raporunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-k4-restore-acceptance
          path: reports/k4-restore-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Kanıtları doğrula ve tek rapor oluştur
        id: kabul
        continue-on-error: true
        run: python -m madsc.batch_acceptance --reports reports/collected --output reports/toplu-kabul.json
      - name: Toplu raporu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-five-system-acceptance
          path: reports/toplu-kabul.json
          retention-days: 14
      - name: Tüm kategori sonuçlarını değerlendir
        if: ${{ always() && !cancelled() }}
        env:
          K1: ${{ needs.k1.result }}
          K2: ${{ needs.k2.result }}
          K3: ${{ needs.k3.result }}
          K4: ${{ needs.k4.result }}
          K5: ${{ needs.k5.result }}
          KABUL: ${{ steps.kabul.outcome }}
          K2_HANDOFF: ${{ steps.k2-handoff.outcome }}
          CROSS_HANDOFF: ${{ steps.cross-handoff.outcome }}
          HISTORY_CHAIN: ${{ steps.history-chain.outcome }}
          K4_RESTORE: ${{ steps.k4-restore.outcome }}
        run: |
          mkdir -p reports
          echo '## Madsc55-Tv - Besli Test Sonuclari' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| Kontrol | Sonuc |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          hata=0
          for ad in K1 K2 K3 K4 K5 KABUL K2_HANDOFF CROSS_HANDOFF HISTORY_CHAIN K4_RESTORE; do
            case "$ad" in
              K1) durum="$K1"; etiket="K1 Guvenlik";;
              K2) durum="$K2"; etiket="K2 Kesif";;
              K3) durum="$K3"; etiket="K3 Kanal";;
              K4) durum="$K4"; etiket="K4 Yedek";;
              K5) durum="$K5"; etiket="K5 Bakim";;
              KABUL) durum="$KABUL"; etiket="Toplu kabul";;
              K2_HANDOFF) durum="$K2_HANDOFF"; etiket="K2-K3-K5 kanit aktarimi";;
              CROSS_HANDOFF) durum="$CROSS_HANDOFF"; etiket="K2-K3-K5 capraz kanit kabul";;
              HISTORY_CHAIN) durum="$HISTORY_CHAIN"; etiket="K2-K3-K5 history zinciri";;
              K4_RESTORE) durum="$K4_RESTORE"; etiket="K4 izole restore kaniti";;
            esac
            echo "| $etiket | $durum |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$durum" != success ]; then hata=1; fi
          done
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ "$hata" -eq 0 ]; then
            echo '**Genel sonuc: BASARILI (yalniz izole testler).**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Genel sonuc: BASARISIZ - uretim onayi yok.**' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'K1=%s\nK2=%s\nK3=%s\nK4=%s\nK5=%s\nKABUL=%s\nGENEL=%s\n' "$K1" "$K2" "$K3" "$K4" "$K5" "$KABUL" "$hata" > reports/test-sonuclari.txt
          exit "$hata"
      - name: Test sonucunu sakla
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-test-sonuclari
          path: reports/test-sonuclari.txt
          retention-days: 14
