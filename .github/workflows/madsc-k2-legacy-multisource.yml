name: Madsc55-Tv Eski Kaynaklardan Genis Turkce TV Kesfi
on:
  push:
    branches: [main]
    paths:
      - madsc/legacy_multisource_discovery.py
      - .github/workflows/madsc-k2-legacy-multisource.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multisource:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan legacy Turkish TV source endpoints safely
        run: python -m madsc.legacy_multisource_discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madsc-k2-legacy-multisource-report
          path: reports/k2-legacy-multisource.json
          retention-days: 14
