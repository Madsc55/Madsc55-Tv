name: Madsc55-Tv - Gercek K2 Gecmis Kaynagi Dogrulama
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verified-history:
    name: Verify real K2 history source (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and GitHub provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test -f verified-history-source/manifest.json || {
            echo 'No independently registered real history source; fail closed.'
            exit 1
          }
          python -m madsc.history_verified_workflow --manifest verified-history-source/manifest.json --output reports/verified-k2-history.json
      - name: Upload verified evidence only on success
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc-verified-k2-history
          path: reports/verified-k2-history.json
          if-no-files-found: error
          retention-days: 14
