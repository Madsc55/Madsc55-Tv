name: Madsc55-Tv - 99 Eski Workflow Toplu Denetim
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-99:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 99 workflow source and K-stage mapping regressions
        run: python -m unittest discover -s tests -p test_legacy_99_source_integrity.py -v
      - name: Inspect 99 original YAML files read only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m madsc.legacy_99_bulk_audit --output reports/legacy-99-source-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: madsc-legacy-99-source-audit
          path: reports/legacy-99-source-audit.json
          if-no-files-found: error
