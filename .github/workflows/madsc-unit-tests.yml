name: MADSC55 — Offline Unit Tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/madsc-unit-tests.yml'
      - 'madsc/**'
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'docs/LEGACY_SOURCE_SCOPE.json'
      - 'docs/K1_K5_KANITLI_GOREV_DEFTERI.json'
  push:
    paths:
      - '.github/workflows/madsc-unit-tests.yml'
      - 'madsc/**'
      - 'src/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'docs/LEGACY_SOURCE_SCOPE.json'
      - 'docs/K1_K5_KANITLI_GOREV_DEFTERI.json'
permissions:
  contents: read
concurrency:
  group: madsc55-offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline Python regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m madsc.offline_gate 2>&1 | tee reports/offline-gate.log
      - name: Preserve offline test diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc55-offline-test-log
          path: reports/offline-gate.log
          if-no-files-found: warn
          retention-days: 14


