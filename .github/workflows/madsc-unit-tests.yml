name: MADSC55 — Offline Unit Tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/madsc-unit-tests.yml'
permissions:
  contents: read
concurrency:
  group: madsc55-offline-unit-tests
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline Python regression suite
        run: python -m madsc.offline_gate
