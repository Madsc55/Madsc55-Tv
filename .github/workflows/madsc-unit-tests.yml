name: MADSC55 — Offline Unit Tests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/madsc-unit-tests.yml'
permissions:
  contents: read
concurrency:
  group: madsc55-offline-unit-tests
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline Python regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          python -m madsc.offline_gate 2>&1 | tee reports/offline-gate.log
      - name: Preserve offline test diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: madsc55-offline-test-log
          path: reports/offline-gate.log
          if-no-files-found: warn
          retention-days: 14
